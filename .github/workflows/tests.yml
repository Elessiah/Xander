name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Tests unitaires
        run: python -m unittest discover -s tests -t . -v

      - name: Apprentissage des exemples
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          for example in res/example*.py; do
            echo "::group::$example"
            python -m xander "$example"
            echo "::endgroup::"
          done

      - name: Éducation d'un fils au Morpion
        env:
          PYTHONIOENCODING: utf-8
        run: python -m xander res/exampleMorpion.py --prof Games.MinmaxMorpion:minmax_morpion_play -q
